<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7f1d1d" />
  <title>ประเมินการบริการ · KKU HR Exp</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Sarabun", "Noto Sans Thai", system-ui, -apple-system, Arial, sans-serif;
      background: #f1f5f9; color: #1e293b; min-height: 100vh;
    }
    .wrap { max-width: 32rem; margin: 0 auto; padding: 16px; }
    .hero {
      background: linear-gradient(135deg, #7f1d1d, #991b1b 55%, #b91c1c);
      border-radius: 1.25rem; padding: 1.75rem 1.25rem; color: #fff;
      box-shadow: 0 12px 26px -14px rgba(127,29,29,.65); text-align: center;
    }
    .hero h1 { margin: 0 0 .35rem; font-size: 1.25rem; }
    .hero p { margin: 0; font-size: .85rem; opacity: .92; }
    .hero .officer { margin-top: .75rem; font-size: 1rem; font-weight: 800; }
    .card { background: #fff; border: 1px solid #f1f5f9; border-radius: 1.25rem; padding: 1.1rem; margin-top: 1rem; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    label.field { display: block; font-size: .8rem; font-weight: 700; color: #475569; margin: .25rem 0 .35rem; }
    .req { color: #dc2626; }
    input[type=text], input[type=email], textarea {
      width: 100%; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: .85rem;
      padding: .7rem .8rem; font-size: .95rem; font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #b91c1c; box-shadow: 0 0 0 3px rgba(185,28,28,.12); }
    textarea { resize: vertical; min-height: 76px; }
    .stars { display: flex; gap: .4rem; font-size: 2rem; line-height: 1; -webkit-user-select: none; user-select: none; }
    .star { cursor: pointer; color: #cbd5e1; transition: transform .08s, color .12s; }
    .star.on { color: #f59e0b; }
    .star:active { transform: scale(.85); }
    .hint { font-size: .72rem; color: #94a3b8; margin-top: .25rem; }
    .btn {
      width: 100%; border: 0; border-radius: .9rem; padding: .95rem; font-size: 1rem; font-weight: 800;
      color: #fff; background: #b91c1c; margin-top: 1.1rem; cursor: pointer; transition: transform .08s, opacity .15s;
    }
    .btn:active { transform: scale(.98); }
    .btn[disabled] { opacity: .6; }
    .center { text-align: center; }
    .hidden { display: none !important; }
    .muted { color: #64748b; font-size: .85rem; }
    .success { font-size: 3rem; }
    .err { color: #b91c1c; font-weight: 700; }
    .foot { text-align: center; font-size: .72rem; color: #94a3b8; margin: 1.25rem 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>⭐ ประเมินการบริการหน้างาน</h1>
      <p>KKU HR Exp · งานโสตทัศนูปกรณ์</p>
      <div id="officerName" class="officer"></div>
    </div>

    <div id="loading" class="card center">
      <p class="muted">กำลังโหลด...</p>
    </div>

    <div id="invalid" class="card center hidden">
      <p class="err" id="invalidMsg">ลิงก์ไม่ถูกต้องหรือหมดอายุ</p>
      <p class="muted" style="margin-top:.5rem">กรุณาสแกน QR ใหม่จากเจ้าหน้าที่</p>
    </div>

    <form id="evalForm" class="hidden" autocomplete="off">
      <div class="card">
        <label class="field" for="title">ชื่อเรื่องที่ขอใช้บริการ <span class="req">*</span></label>
        <input id="title" type="text" placeholder="เช่น ขอยืมเครื่องเสียงงานสัมมนา" maxlength="200" />

        <label class="field" for="location" style="margin-top:.9rem">สถานที่</label>
        <input id="location" type="text" placeholder="เช่น อาคารพจน์ฯ ห้องประชุม 2" maxlength="200" />

        <label class="field" for="email" style="margin-top:.9rem">อีเมลผู้ขอ (ไม่บังคับ)</label>
        <input id="email" type="email" placeholder="you@kku.ac.th" maxlength="120" />
      </div>

      <div class="card">
        <label class="field">แก้ไขได้รวดเร็ว (0–5 ดาว)</label>
        <div class="stars" id="starsFast">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
        <div class="hint">แตะดาวเพื่อให้คะแนน · ไม่ให้คะแนนได้</div>

        <label class="field" style="margin-top:1rem">แก้ไขไม่ได้ แจ้งส่วนอื่น (0–2 ดาว)</label>
        <div class="stars" id="starsUnable">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
        </div>
        <div class="hint">ให้คะแนนเมื่อถูกส่งต่อไปยังส่วนอื่นแทน · ไม่ให้คะแนนได้</div>
      </div>

      <div class="card">
        <label class="field" for="comment">ความเห็นเพิ่มเติม</label>
        <textarea id="comment" placeholder="ข้อเสนอแนะหรือคำชม" maxlength="1000"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn">📤 ส่งแบบประเมิน</button>
    </form>

    <div id="done" class="card center hidden">
      <div class="success">🎉</div>
      <h2 style="margin:.5rem 0; font-size:1.1rem">ขอบคุณสำหรับการประเมิน</h2>
      <p class="muted" id="doneStars"></p>
    </div>

    <div class="foot">KKU HR Exp · Phase 6.24</div>
  </div>

  <script>
    const CONFIG = {
      APPS_SCRIPT_URL : "https://script.google.com/macros/s/AKfycbwJDnlvsrBO4SvZmPOoytZRoqHy67Ef1QGg_345eTkx9NUZuLvbPXQ2KUBQNqygpWXP/exec"
    };
    const $ = (id) => document.getElementById(id);
    const token = (new URLSearchParams(location.search)).get("t") || "";
    let ratingFast = 0, ratingUnable = 0;

    function apiGet(params) {
      return new Promise((resolve, reject) => {
        const cb = "hrxcb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        const qs = Object.keys(params).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
        const s = document.createElement("script");
        let done = false;
        const cleanup = () => { done = true; try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); };
        window[cb] = (data) => { if (done) return; cleanup(); resolve(data); };
        s.onerror = () => { if (done) return; cleanup(); reject(new Error("network")); };
        s.src = CONFIG.APPS_SCRIPT_URL + "?" + qs + "&callback=" + cb;
        document.body.appendChild(s);
        setTimeout(() => { if (!done) { cleanup(); reject(new Error("timeout")); } }, 12000);
      });
    }

    function renderStars(container, value) {
      container.querySelectorAll(".star").forEach(st => st.classList.toggle("on", Number(st.dataset.v) <= value));
    }
    function bindStars(container, setter, getter) {
      container.querySelectorAll(".star").forEach(st => {
        st.addEventListener("click", () => {
          const v = Number(st.dataset.v);
          setter(v === getter() ? 0 : v);
          renderStars(container, getter());
        });
      });
    }
    bindStars($("starsFast"), v => ratingFast = v, () => ratingFast);
    bindStars($("starsUnable"), v => ratingUnable = v, () => ratingUnable);

    function showInvalid(msg) {
      $("loading").classList.add("hidden");
      $("invalid").classList.remove("hidden");
      if (msg) $("invalidMsg").textContent = msg;
    }

    async function init() {
      if (!token) { showInvalid("ไม่พบรหัสประเมินในลิงก์"); return; }
      try {
        const d = await apiGet({ action: "serviceEvalInfo", token: token });
        if (!d || d.status !== "ok") { showInvalid((d && d.message) || "ลิงก์ไม่ถูกต้องหรือหมดอายุ"); return; }
        $("officerName").textContent = "เจ้าหน้าที่: " + (d.name || "-");
        $("loading").classList.add("hidden");
        $("evalForm").classList.remove("hidden");
      } catch (e) {
        showInvalid("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่");
      }
    }

    $("evalForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = $("title").value.trim();
      if (!title) { alert("กรุณากรอกชื่อเรื่องที่ขอใช้บริการ"); $("title").focus(); return; }
      const btn = $("submitBtn");
      btn.disabled = true; btn.textContent = "กำลังส่ง...";
      const payload = {
        action: "submitEvaluation",
        token: token,
        title: title,
        location: $("location").value.trim(),
        submitterEmail: $("email").value.trim(),
        ratingFast: ratingFast,
        ratingUnable: ratingUnable,
        comment: $("comment").value.trim()
      };
      try {
        await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (err) { /* fire-and-forget: no-cors may throw for some browsers */ }
      const total = ratingFast + ratingUnable;
      $("doneStars").textContent = total > 0
        ? ("ให้ " + total + " ดาว · เจ้าหน้าที่ได้รับ " + total + " XP")
        : "บันทึกการประเมินเรียบร้อยแล้ว";
      $("evalForm").classList.add("hidden");
      $("done").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    init();
  </script>
</body>
</html>
